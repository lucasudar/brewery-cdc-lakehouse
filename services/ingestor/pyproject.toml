[project]
name = "ingestor"
version = "0.1.0"
description = "Debezium CDC (Redpanda) -> Apache Iceberg sink: bronze changelog + silver current state"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka==2.16.0",
    "pyiceberg[pyarrow,s3fs,pyiceberg-core]==0.12.0",
    "pydantic-settings==2.16.1",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pyiceberg[sql-sqlite]==0.12.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestor"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
