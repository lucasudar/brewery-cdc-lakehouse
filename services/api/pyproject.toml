[project]
name = "api"
version = "0.1.0"
description = "Read API over the Iceberg lakehouse (silver current state + gold mart)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic-settings==2.16.1",
    "pyiceberg[pyarrow,s3fs]==0.12.0",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pyiceberg[sql-sqlite]==0.12.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
extend-ignore = ["B008"]  # FastAPI dependency defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
