[project]
name = "transformer"
version = "0.1.0"
description = "dbt-duckdb models over Iceberg silver tables, published to Iceberg gold (write-audit-publish)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
    "duckdb==2.0.0",
    "pyiceberg[pyarrow,s3fs]==0.12.0",
    "pydantic-settings==2.16.1",
    "structlog==26.1.0",
]

[dependency-groups]
dev = ["ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformer"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
